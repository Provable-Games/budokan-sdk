name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sdk: ${{ steps.filter.outputs.sdk }}
      infra_ci: ${{ steps.filter.outputs.infra_ci }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            sdk:
              - "src/**"
              - "tests/**"
              - "package.json"
              - "bun.lock"
              - "tsconfig.json"
              - "tsup.config.ts"
            infra_ci:
              - ".github/workflows/**"
              - ".github/prompts/**"

  infra-validate:
    needs: changes
    if: needs.changes.outputs.infra_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow YAML
        run: |
          YAML_CLI="yaml@2.8.1"
          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$file" ] || continue
            npx -y "$YAML_CLI" valid < "$file"
          done

  # Always runs: `test` is a required status check, so it must report on
  # every PR (a conditional skip leaves the required check pending and
  # blocks merge on docs/CI-only PRs).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run typecheck:tests
      - run: bun run test
      - run: bun run build

  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - run: bun install --frozen-lockfile && bun run build
      - name: Check the bot against this SDK
        working-directory: examples/telegram-controller-bot/server
        run: bun install --frozen-lockfile && bun run typecheck && bun test
      - name: Check the MCP example against this SDK
        working-directory: examples/mcp-server
        run: bun install --frozen-lockfile && bun run typecheck
      - name: Build the bot image from the repository root
        run: docker build -f examples/telegram-controller-bot/server/Dockerfile -t budokan-bot:ci .
      - name: Verify SDK and session imports in the runtime image
        run: |
          docker run --rm --entrypoint node budokan-bot:ci --experimental-wasm-modules --import tsx --input-type=module -e '
            import assert from "node:assert/strict";
            import { buildEnterTournamentForRecipientsCall } from "@provable-games/budokan-sdk";
            import { buildSessionPolicies } from "./src/policies.ts";
            import SessionProvider from "@cartridge/controller/session/node";
            const call = buildEnterTournamentForRecipientsCall("0x1234", {
              tournamentId: "1", recipients: [{ playerAddress: "0xab" }],
            });
            const policies = buildSessionPolicies("sepolia", call.contractAddress);
            assert(policies.contracts[call.contractAddress].methods.some(m => m.entrypoint === call.entrypoint));
            assert.equal(typeof SessionProvider, "function");
          '

  # AI code review (Claude + Codex) is delegated to the org-shared reusable
  # workflow so the review logic and model config live in one place. This
  # repo supplies only .github/review-agents.json + .github/prompts/*.md.
  review:
    uses: Provable-Games/.github/.github/workflows/code-review.yml@bd41f96e283f731daf917720c1f1dd7e2bf3a6f7
    # Repo default workflow token is read-only; a reusable workflow's job
    # permissions can't exceed the caller's, so grant the write scopes the
    # review jobs need (PR comments + Claude OIDC) here.
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    secrets: inherit
